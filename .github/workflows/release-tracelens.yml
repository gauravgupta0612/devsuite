name: Release TraceLens

# Releases automatically whenever extensions/tracelens/package.json on main has a version
# that has not been tagged yet. You can also run it by hand (Actions -> Release -> Run workflow)
# and pick patch/minor/major: the workflow bumps the version, commits it as gauravgupta0612,
# tags it (tracelens-vX.Y.Z), builds the VSIX, creates the GitHub Release and publishes to the Marketplace.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/tracelens/**'
      - 'packages/core/**'
      - 'packages/vscode-common/**'
      - '.github/workflows/release-tracelens.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-tracelens
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't re-trigger on the release commit this workflow pushes itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git author
        run: |
          git config user.name "gauravgupta0612"
          git config user.email "gauravgupta0612@users.noreply.github.com"

      - run: npm ci

      - name: Bump version (manual run only)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version --workspace tracelens
          VERSION=$(node -p "require('./extensions/tracelens/package.json').version")
          DATE=$(date -u +%Y-%m-%d)
          awk -v v="$VERSION" -v d="$DATE" 'NR==1{print; print ""; print "## " v " — " d; print "- See the GitHub release notes for the full list of changes."; next} {print}' \
            extensions/tracelens/CHANGELOG.md > /tmp/CHANGELOG.md && mv /tmp/CHANGELOG.md extensions/tracelens/CHANGELOG.md
          git add extensions/tracelens/package.json extensions/tracelens/CHANGELOG.md package-lock.json
          git commit -m "chore(release): tracelens v$VERSION"
          git push origin HEAD:${{ github.ref_name }}

      - name: Read version and check tag
        id: ver
        run: |
          VERSION=$(node -p "require('./extensions/tracelens/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "tracelens-v$VERSION" >/dev/null 2>&1; then
            echo "Tag tracelens-v$VERSION already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.ver.outputs.release == 'true'
        run: npm test

      - name: Package VSIX
        if: steps.ver.outputs.release == 'true'
        run: npm run package:tracelens

      - name: Tag
        if: steps.ver.outputs.release == 'true'
        run: |
          git tag -a "tracelens-v${{ steps.ver.outputs.version }}" -m "TraceLens v${{ steps.ver.outputs.version }}"
          git push origin "tracelens-v${{ steps.ver.outputs.version }}"

      - name: GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tracelens-v${{ steps.ver.outputs.version }}" \
            extensions/tracelens/tracelens-${{ steps.ver.outputs.version }}.vsix \
            --title "TraceLens v${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: steps.ver.outputs.release == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: extensions/tracelens
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret not set - skipping Marketplace publish."
            exit 0
          fi
          npx vsce publish --no-dependencies --packagePath tracelens-${{ steps.ver.outputs.version }}.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: steps.ver.outputs.release == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: extensions/tracelens
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set - skipping Open VSX publish."
            exit 0
          fi
          npx --yes ovsx publish tracelens-${{ steps.ver.outputs.version }}.vsix -p "$OVSX_PAT"
