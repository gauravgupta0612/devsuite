name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test shared engine (@devsuite/core)
        run: npm test
      - name: Type-check and package RepoPilot
        run: npm run package:repopilot
      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-vsix
          path: extensions/repopilot/*.vsix
          if-no-files-found: error
